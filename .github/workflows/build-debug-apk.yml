name: Build and release debug APK

on:
  push:
    branches:
      - ci/debug-apk-dictionary-search
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and release Android debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Keep the same debug certificate between workflow runs so new APKs
      # can be installed as updates instead of being rejected as a signature
      # mismatch. The cache is created on the first successful build.
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          name: Debug APK build #${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
